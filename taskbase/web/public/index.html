<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1728">
  <title>Taskbase · 播客任务后台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 5 1.2 1.2L7 4.5M4 11l1.2 1.2L7 10.5M4 17l1.2 1.2L7 16.5"/></symbol>
    <symbol id="i-app" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9A7 7 0 0 1 18.7 7.3L20 11M4 13l1.3 3.7A7 7 0 0 0 17.9 15"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="m15 8 4 4-4 4M19 12H9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6H21"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3v-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.4 7 7.2 4.2l.1.1A1.7 1.7 0 0 0 9.2 4a1.7 1.7 0 0 0 1-1.6V2h4v.4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L20 6.4l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4h-.2a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
  </svg>

  <section id="login-view" class="login-shell">
    <div class="login-visual">
      <div class="login-brand">
        <div class="brand-mark">TB</div>
        <span>Taskbase</span>
      </div>
      <div class="login-copy">
        <span class="eyebrow light">PERSONAL TASK PLATFORM</span>
        <h1>把重复的事，<br>交给任务底座。</h1>
        <p>任务、调度、Worker 和播客采集，在一个安静的后台里运转。</p>
      </div>
      <div class="login-points">
        <span><i class="dot green"></i>任务可恢复</span>
        <span><i class="dot blue"></i>cron 调度</span>
        <span><i class="dot amber"></i>播客列表入库</span>
      </div>
      <svg class="login-art" viewBox="0 0 620 300" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="lg-line" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#6fa8ff" stop-opacity=".7"/><stop offset="1" stop-color="#6fa8ff" stop-opacity=".08"/>
          </linearGradient>
          <linearGradient id="lg-card" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
          </linearGradient>
        </defs>
        <g stroke="url(#lg-line)" stroke-width="1.2">
          <path d="M60 210 180 150 300 190 430 98 560 135"/>
          <path d="M60 210 300 190 560 240"/>
          <path d="M180 150 300 70 430 98"/>
        </g>
        <g fill="url(#lg-card)" stroke="#8bb8ff" stroke-opacity=".35">
          <rect x="35" y="182" width="96" height="52" rx="12"/>
          <rect x="148" y="122" width="96" height="52" rx="12"/>
          <rect x="272" y="162" width="96" height="52" rx="12"/>
          <rect x="400" y="70" width="110" height="52" rx="12"/>
          <rect x="522" y="214" width="76" height="48" rx="12"/>
        </g>
        <g fill="#9cc5ff">
          <circle cx="83" cy="208" r="4"/><circle cx="196" cy="148" r="4"/><circle cx="320" cy="188" r="4"/>
          <circle cx="455" cy="96" r="4"/><circle cx="558" cy="238" r="4"/>
        </g>
        <g fill="#d8e8ff" font-family="ui-monospace, Menlo, monospace" font-size="10" opacity=".8">
          <text x="53" y="201">queued</text><text x="164" y="141">running</text>
          <text x="288" y="181">recovering</text><text x="417" y="89">schedule</text>
          <text x="530" y="233">done</text>
        </g>
      </svg>
      <div class="login-foot">v0.2 · 单用户 · 单服务器</div>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <span class="eyebrow">欢迎回来</span>
        <h2>登录工作台</h2>
        <p class="login-sub">使用平台所有者账号继续</p>
        <form id="login-form" class="stack">
          <label class="field">
            <span>用户名</span>
            <input id="login-username" name="username" autocomplete="username" value="owner" required>
          </label>
          <label class="field">
            <span>密码</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-block btn-lg" type="submit">
            <svg class="icon"><use href="#i-arrow"/></svg>进入工作台
          </button>
          <div id="login-error" class="form-error" hidden></div>
        </form>
        <div class="login-meta">
          <span><i class="dot green"></i>登录状态保持 30 天</span>
          <span>Taskbase / podcast ops</span>
        </div>
      </div>
    </div>
  </section>

  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">TB</div>
        <div>
          <strong>Taskbase</strong>
          <span>v0.2</span>
        </div>
      </div>
      <nav id="nav" class="nav">
        <div class="nav-label">平台管理</div>
        <button type="button" data-route="overview"><svg class="icon"><use href="#i-grid"/></svg><span>总览</span></button>
        <button type="button" data-route="apps"><svg class="icon"><use href="#i-app"/></svg><span>应用</span></button>
        <button type="button" data-route="schedules"><svg class="icon"><use href="#i-calendar"/></svg><span>调度</span></button>
        <div class="nav-label">播客任务</div>
        <button type="button" data-route="podcast-shows"><svg class="icon"><use href="#i-mic"/></svg><span>内容库</span></button>
        <button type="button" data-route="episodes"><svg class="icon"><use href="#i-layers"/></svg><span>单集库</span></button>
        <button type="button" data-route="tasks"><svg class="icon"><use href="#i-tasks"/></svg><span>任务</span></button>
      </nav>
      <div class="sidebar-status">
        <span class="status-light"></span>
        <div><strong>Worker 待命</strong><span>SQLite WAL · 调度运行中</span></div>
      </div>
      <div class="sidebar-foot">
        <div class="avatar">O</div>
        <div class="sidebar-user"><strong id="current-user">owner</strong><span>Owner</span></div>
        <button id="logout-button" type="button" class="icon-button" title="退出登录" aria-label="退出登录">
          <svg class="icon"><use href="#i-logout"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-context">
          <div class="breadcrumb">Workspace <span>/</span> <span id="breadcrumb-current">总览</span></div>
          <h1 id="page-title">总览</h1>
          <p id="page-subtitle" class="muted"></p>
        </div>
        <div id="page-actions" class="page-actions"></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modal-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
