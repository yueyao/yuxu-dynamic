name: yuxu-funasr

services:
  funasr:
    image: yuxu-funasr:1.4.19-cpu
    build:
      context: ../..
      dockerfile: deploy/funasr/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${FUNASR_BIND_ADDRESS:-127.0.0.1}:${FUNASR_PORT:-8000}:8000"
    volumes:
      - funasr-model-cache:/models
    environment:
      HF_HOME: /models/huggingface
      MODELSCOPE_CACHE: /models/modelscope
      XDG_CACHE_HOME: /models/cache
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 5

volumes:
  funasr-model-cache:
