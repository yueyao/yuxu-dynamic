# Render with envsubst '${TASKBASE_DOMAIN}' after issuing the certificate.
# Replace the old taskbase-80.conf and disable the public 3410 listener.
server {
    listen 80;
    server_name ${TASKBASE_DOMAIN} 43.156.253.152;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://${TASKBASE_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${TASKBASE_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${TASKBASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TASKBASE_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location /v1/ {
        proxy_pass http://127.0.0.1:3411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
